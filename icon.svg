<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <rect width="512" height="512" rx="96" fill="url(#g)" fill-opacity="0.25"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Dumbbell built from graduated, gradient-shaded plates to read as a
       stacked side-profile (like real weight plates on a bar) instead of
       flat single-tone shapes. -->
  <g stroke="#0f172a" stroke-width="5" stroke-linejoin="round">
    <rect x="46" y="224" width="18" height="64" rx="7" fill="url(#metal)"/>
    <rect x="68" y="206" width="24" height="100" rx="9" fill="url(#metal)"/>
    <rect x="96" y="188" width="30" height="136" rx="11" fill="url(#metal)"/>
    <rect x="130" y="238" width="16" height="36" rx="6" fill="url(#steel)"/>

    <rect x="448" y="224" width="18" height="64" rx="7" fill="url(#metal)"/>
    <rect x="420" y="206" width="24" height="100" rx="9" fill="url(#metal)"/>
    <rect x="386" y="188" width="30" height="136" rx="11" fill="url(#metal)"/>
    <rect x="366" y="238" width="16" height="36" rx="6" fill="url(#steel)"/>

    <rect x="150" y="243" width="212" height="26" rx="13" fill="url(#steel)"/>
  </g>

  <!-- grip knurling on the bar -->
  <g fill="#0f172a" opacity="0.45">
    <rect x="236" y="249" width="4" height="14" rx="2"/>
    <rect x="248" y="249" width="4" height="14" rx="2"/>
    <rect x="260" y="249" width="4" height="14" rx="2"/>
    <rect x="272" y="249" width="4" height="14" rx="2"/>
  </g>

</svg>
